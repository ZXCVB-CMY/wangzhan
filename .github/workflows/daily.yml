name: daily

on:
  schedule:
    # 07:10 北京时间（UTC 23:10 前一天）
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "逗号分隔的源 id，留空用配置启用项"
        required: false
        default: ""
      no_llm:
        description: "跳过 LLM（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python run.py \
            --sources "${{ github.event.inputs.sources || '' }}" \
            ${{ github.event.inputs.no_llm == 'true' && '--no-llm' || '' }}

      - name: 提交产物
        run: |
          git config user.name  "car-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "daily: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi